<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Football Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; touch-action: none; }
        body { background: #050b14; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; z-index: 5; }
        .hud-top { display: flex; justify-content: space-between; width: 100%; }
        .stat-box { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(34, 197, 94, 0.5); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 8px; font-weight: 800; font-size: 14px; color: #4ade80; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
        .stat-box span { color: #fff; font-size: 16px; }

        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border: 2px solid #22c55e; border-radius: 50%; pointer-events: none; z-index: 6; box-shadow: 0 0 8px #22c55e; }

        /* Mobile Touch Controls */
        #touch-zone-left { position: absolute; bottom: 0; left: 0; width: 50vw; height: 70vh; z-index: 10; }
        #touch-zone-right { position: absolute; bottom: 0; right: 0; width: 50vw; height: 100vh; z-index: 9; }

        #joystick-base { position: absolute; width: 90px; height: 90px; background: rgba(255,255,255,0.1); border: 2px solid rgba(34, 197, 94, 0.6); border-radius: 50%; display: none; pointer-events: none; z-index: 11; transform: translate(-50%, -50%); }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 36px; height: 36px; background: #22c55e; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px #22c55e; }

        .mobile-btn { position: absolute; z-index: 12; background: rgba(15, 23, 42, 0.85); border: 2px solid #22c55e; color: #fff; font-weight: 800; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); backdrop-filter: blur(4px); }
        .mobile-btn:active { transform: scale(0.92); }
        #btn-kick { bottom: 30px; right: 25px; width: 75px; height: 75px; background: rgba(34, 197, 94, 0.85); border-color: #86efac; box-shadow: 0 0 20px rgba(34, 197, 94, 0.6); font-size: 15px; }
        #btn-reset { bottom: 120px; right: 35px; width: 50px; height: 50px; font-size: 10px; border-color: #38bdf8; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="hud">
        <div class="hud-top">
            <div class="stat-box">GOALS: <span id="goals">0</span></div>
            <div class="stat-box">SHOTS: <span id="shots">0</span></div>
        </div>
    </div>

    <div id="touch-zone-left"></div>
    <div id="touch-zone-right"></div>

    <div id="joystick-base"><div id="joystick-stick"></div></div>

    <div id="btn-kick" class="mobile-btn">KICK</div>
    <div id="btn-reset" class="mobile-btn">RESET</div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, clock;
        let ball, ballVel = new THREE.Vector3();
        let keeper, keeperDir = 1;
        let goals = 0, shots = 0;
        let isPlaying = true, isBallKicked = false;

        let yaw = 0, pitch = 0;
        let walkCycle = 0;
        const moveVector = { x: 0, z: 0 };

        let leftTouchId = null, rightTouchId = null;
        let joystickCenter = { x: 0, y: 0 };
        let lastRightTouch = { x: 0, y: 0 };

        function init() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050b14);
            scene.fog = new THREE.FogExp2(0x050b14, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            document.getElementById('canvas-container').appendChild(renderer.domElement);

            setupLighting();
            setupEnvironment();
            setupBallAndKeeper();
            setupTouchControls();

            resetBall();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupLighting() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            // Stadium Floodlights
            const spot1 = new THREE.SpotLight(0xffffff, 2.0);
            spot1.position.set(-25, 35, 10);
            spot1.castShadow = true;
            scene.add(spot1);

            const spot2 = new THREE.SpotLight(0x38bdf8, 1.5);
            spot2.position.set(25, 35, -30);
            scene.add(spot2);
        }

        // Procedural Soccer Ball Pattern
        function createSoccerBallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 1024, 512);

            ctx.fillStyle = '#111827';
            const drawPentagon = (cx, cy, r) => {
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 72 - 18) * Math.PI / 180;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
            };

            for (let row = 0; row < 6; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((row + col) % 2 === 0) {
                        drawPentagon(col * 130 + 65, row * 90 + 45, 28);
                    }
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        // Procedural Striped Grass Texture
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#15803d';
            ctx.fillRect(0, 0, 512, 512);

            ctx.fillStyle = '#166534';
            for (let i = 0; i < 512; i += 64) {
                ctx.fillRect(0, i, 512, 32);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(10, 20);
            return texture;
        }

        function setupEnvironment() {
            // Striped Field
            const pitchGeo = new THREE.PlaneGeometry(80, 120);
            const pitchMat = new THREE.MeshStandardMaterial({ map: createGrassTexture(), roughness: 0.6 });
            const pitchMesh = new THREE.Mesh(pitchGeo, pitchMat);
            pitchMesh.rotation.x = -Math.PI / 2;
            pitchMesh.receiveShadow = true;
            scene.add(pitchMesh);

            // Goal Posts and Net
            const postMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.1, metalness: 0.8 });
            const goalGroup = new THREE.Group();

            const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.2, 16), postMat);
            leftPost.position.set(-3.66, 1.6, -25);

            const rightPost = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.2, 16), postMat);
            rightPost.position.set(3.66, 1.6, -25);

            const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 7.44, 16), postMat);
            crossbar.rotation.z = Math.PI / 2;
            crossbar.position.set(0, 3.2, -25);

            const netGeo = new THREE.PlaneGeometry(7.32, 3.2);
            const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.4 });
            const net = new THREE.Mesh(netGeo, netMat);
            net.position.set(0, 1.6, -26);

            goalGroup.add(leftPost, rightPost, crossbar, net);
            scene.add(goalGroup);
        }

        function setupBallAndKeeper() {
            // Textured 3D Soccer Ball
            const ballGeo = new THREE.SphereGeometry(0.24, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ map: createSoccerBallTexture(), roughness: 0.3, metalness: 0.1 });
            ball = new THREE.Mesh(ballGeo, ballMat);
            ball.castShadow = true;
            scene.add(ball);

            // Goalkeeper Model
            keeper = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xfdba74, roughness: 0.5 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 0.35), bodyMat);
            torso.position.y = 1.1;
            torso.castShadow = true;

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), skinMat);
            head.position.y = 1.8;

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), bodyMat);
            armL.position.set(-0.45, 1.1, 0);
            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), bodyMat);
            armR.position.set(0.45, 1.1, 0);

            keeper.add(torso, head, armL, armR);
            keeper.position.set(0, 0, -24.5);
            scene.add(keeper);
        }

        function resetBall() {
            camera.position.set(0, 1.7, -8);
            yaw = 0; pitch = 0;
            ball.position.set(0, 0.24, -10);
            ballVel.set(0, 0, 0);
            isBallKicked = false;
        }

        function setupTouchControls() {
            const leftZone = document.getElementById('touch-zone-left');
            const rightZone = document.getElementById('touch-zone-right');
            const joyBase = document.getElementById('joystick-base');
            const joyStick = document.getElementById('joystick-stick');

            leftZone.addEventListener('touchstart', (e) => {
                if (leftTouchId !== null) return;
                const touch = e.changedTouches[0];
                leftTouchId = touch.identifier;
                joystickCenter = { x: touch.clientX, y: touch.clientY };

                joyBase.style.left = `${touch.clientX}px`;
                joyBase.style.top = `${touch.clientY}px`;
                joyBase.style.display = 'block';
                joyStick.style.transform = 'translate(-50%, -50%)';
            });

            leftZone.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === leftTouchId) {
                        const dx = touch.clientX - joystickCenter.x;
                        const dy = touch.clientY - joystickCenter.y;
                        const dist = Math.min(Math.hypot(dx, dy), 35);
                        const angle = Math.atan2(dy, dx);

                        const clampX = Math.cos(angle) * dist;
                        const clampY = Math.sin(angle) * dist;

                        joyStick.style.transform = `translate(calc(-50% + ${clampX}px), calc(-50% + ${clampY}px))`;

                        moveVector.x = clampX / 35;
                        moveVector.z = clampY / 35;
                    }
                }
            });

            const resetLeftTouch = (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === leftTouchId) {
                        leftTouchId = null;
                        moveVector.x = 0; moveVector.z = 0;
                        joyBase.style.display = 'none';
                    }
                }
            };
            leftZone.addEventListener('touchend', resetLeftTouch);
            leftZone.addEventListener('touchcancel', resetLeftTouch);

            rightZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                rightTouchId = touch.identifier;
                lastRightTouch = { x: touch.clientX, y: touch.clientY };
            });

            rightZone.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === rightTouchId) {
                        const dx = touch.clientX - lastRightTouch.x;
                        const dy = touch.clientY - lastRightTouch.y;

                        yaw -= dx * 0.004;
                        pitch -= dy * 0.004;
                        pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));

                        lastRightTouch = { x: touch.clientX, y: touch.clientY };
                    }
                }
            });

            rightZone.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === rightTouchId) rightTouchId = null;
                }
            });

            document.getElementById('btn-kick').addEventListener('touchstart', (e) => { e.preventDefault(); kickBall(); });
            document.getElementById('btn-reset').addEventListener('touchstart', (e) => { e.preventDefault(); resetBall(); });
        }

        function kickBall() {
            if (isBallKicked) return;

            isBallKicked = true;
            shots++;
            document.getElementById('shots').innerText = shots;

            const dir = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
            ballVel.copy(dir).multiplyScalar(0.65);
            ballVel.y = Math.max(0.08, dir.y * 0.5 + 0.12);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Player Movement
            const isMoving = Math.abs(moveVector.x) > 0.1 || Math.abs(moveVector.z) > 0.1;
            camera.translateX(moveVector.x * 0.1);
            camera.translateZ(moveVector.z * 0.1);

            if (isMoving) {
                walkCycle += 0.15;
                camera.position.y = 1.7 + Math.sin(walkCycle) * 0.03;
            } else {
                camera.position.y = 1.7;
            }

            // Goalkeeper AI Movement
            keeper.position.x += 0.035 * keeperDir;
            if (Math.abs(keeper.position.x) > 2.7) keeperDir *= -1;

            // Physics Loop
            if (isBallKicked) {
                ball.position.add(ballVel);
                ballVel.y -= 0.012; // Gravity
                ball.rotation.x += 0.2;
                ball.rotation.y += 0.1;

                // Bounce Ground
                if (ball.position.y <= 0.24) {
                    ball.position.y = 0.24;
                    ballVel.y *= -0.4;
                    ballVel.x *= 0.8;
                    ballVel.z *= 0.8;
                }

                // Score Detection
                if (ball.position.z <= -25 && ball.position.z >= -26) {
                    if (Math.abs(ball.position.x) < 3.5 && ball.position.y < 3.2) {
                        goals++;
                        document.getElementById('goals').innerText = goals;
                        resetBall();
                    }
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
