<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Retro Cyber</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --cell-bg: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --color-x: #38bdf8;
            --color-o: #f43f5e;
            --color-draw: #10b981;
            --accent: #6366f1;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            border: 1px solid #475569;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, var(--color-x), var(--color-o));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Scoreboard Styling */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .score-box {
            background: #0f172a80;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-box .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .score-box .val {
            font-size: 1.5rem;
            font-weight: 700;
        }

        #score-x .val { color: var(--color-x); }
        #score-draw .val { color: var(--color-draw); }
        #score-o .val { color: var(--color-o); }

        #turn-indicator {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--text-main);
            min-height: 27px;
        }

        /* Grid Layout */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
            aspect-ratio: 1 / 1;
        }

        .cell {
            background: var(--cell-bg);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.75rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            user-select: none;
        }

        .cell:hover:not(.taken) {
            background: #475569;
            transform: scale(1.03);
            border-color: #64748b;
        }

        .cell.taken {
            cursor: not-allowed;
            background: #1e293b;
            border-color: #334155;
        }

        /* Stylized X and O Marks */
        .cell.p-x {
            color: var(--color-x);
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .cell.p-o {
            color: var(--color-o);
            text-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
        }

        /* Control Buttons */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #restart-btn {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        #restart-btn:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        #reset-scoreboard-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #334155;
        }

        #reset-scoreboard-btn:hover {
            background: #ef444415;
            color: #ef4444;
            border-color: #ef444450;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        
        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-box" id="score-x">
                <span class="label">Player X</span>
                <span class="val">0</span>
            </div>
            <div class="score-box" id="score-draw">
                <span class="label">Draws</span>
                <span class="val">0</span>
            </div>
            <div class="score-box" id="score-o">
                <span class="label">Player O</span>
                <span class="val">0</span>
            </div>
        </div>

        <div id="turn-indicator">Player X's Turn</div>
        
        <!-- Board Grid -->
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="restart-btn">Next Round</button>
            <button id="reset-scoreboard-btn">Reset All Scores</button>
        </div>
    </div>

    <script>
        const cellElements = document.querySelectorAll('.cell');
        const turnIndicator = document.getElementById('turn-indicator');
        const restartBtn = document.getElementById('restart-btn');
        const resetScoreboardBtn = document.getElementById('reset-scoreboard-btn');

        const scoreXVal = document.querySelector('#score-x .val');
        const scoreOVal = document.querySelector('#score-o .val');
        const scoreDrawVal = document.querySelector('#score-draw .val');

        let currentPlayer = 'X';
        let gameActive = true;
        let gameState = ["", "", "", "", "", "", "", "", ""];

        let scores = { X: 0, O: 0, draws: 0 };

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Horizontals
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Verticals
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (gameState[clickedCellIndex] !== "" || !gameActive) return;

            handleCellPlayed(clickedCell, clickedCellIndex);
            handleResultValidation();
        }

        function handleCellPlayed(cell, index) {
            gameState[index] = currentPlayer;
            cell.innerText = currentPlayer;
            cell.classList.add('taken', currentPlayer === 'X' ? 'p-x' : 'p-o');
        }

        function handleResultValidation() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                turnIndicator.innerHTML = `Player <span style="color: var(--color-${currentPlayer.toLowerCase()})">${currentPlayer}</span> Wins!`;
                scores[currentPlayer]++;
                updateScoreboard();
                gameActive = false;
                return;
            }

            if (!gameState.includes("")) {
                turnIndicator.innerHTML = `<span style="color: var(--color-draw)">It's a Draw!</span>`;
                scores.draws++;
                updateScoreboard();
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            turnIndicator.innerHTML = `Player <span style="color: var(--color-${currentPlayer.toLowerCase()})">${currentPlayer}</span>'s Turn`;
        }

        function handleRestartGame() {
            gameActive = true;
            currentPlayer = "X";
            gameState = ["", "", "", "", "", "", "", "", ""];
            turnIndicator.innerHTML = `Player <span style="color: var(--color-x)">X</span>'s Turn`;
            cellElements.forEach(cell => {
                cell.innerText = "";
                cell.className = "cell";
            });
        }

        function updateScoreboard() {
            scoreXVal.innerText = scores.X;
            scoreOVal.innerText = scores.O;
            scoreDrawVal.innerText = scores.draws;
        }

        function handleResetScoreboard() {
            scores = { X: 0, O: 0, draws: 0 };
            updateScoreboard();
            handleRestartGame();
        }
