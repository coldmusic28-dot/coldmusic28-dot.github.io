<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe with Scoreboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        
        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-box">
                <span>Player X</span>
                <span id="score-x">0</span>
            </div>
            <div class="score-box">
                <span>Draws</span>
                <span id="score-draw">0</span>
            </div>
            <div class="score-box">
                <span>Player O</span>
                <span id="score-o">0</span>
            </div>
        </div>

        <h2 id="turn-indicator">Player X's Turn</h2>
        
        <!-- Board -->
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="restart-btn">Restart Game</button>
        <button id="reset-scoreboard-btn">Reset Scoreboard</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
