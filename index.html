<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --cell-bg: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --color-x: #38bdf8;
            --color-o: #f43f5e;
            --color-draw: #10b981; /* Green */
            --accent: #6366f1;
        }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { text-align: center; background: var(--container-bg); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #475569; }
        h1 { font-size: 2rem; margin-bottom: 25px; background: linear-gradient(to right, var(--color-x), var(--color-o)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        
        .scoreboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        .score-box { background: #0f172a80; padding: 12px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; }
        .label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
        .val { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
        #score-x .val { color: var(--color-x); }
        #score-draw .val { color: var(--color-draw); }
        #score-o .val { color: var(--color-o); }
        
        #turn-indicator { font-size: 1.1rem; font-weight: 600; margin-bottom: 25px; min-height: 27px; }
        
        /* UNBREAKABLE MATRIX: Absolute pixel controls eliminate any dynamic stretching or collapses */
        .board { 
            display: block !important;
            margin: 0 auto 25px auto !important; 
            width: 312px !important;
            height: 312px !important;
        }

        /* Hardcoded structural row containers */
        .board-row {
            display: flex !important;
            gap: 12px !important;
            width: 312px !important;
            height: 96px !important;
            margin-bottom: 12px !important;
        }
        
        /* Absolute fixed width and height constraints on cells override any compiler bugs */
        .cell { 
            width: 96px !important;
            min-width: 96px !important;
            max-width: 96px !important;
            height: 96px !important;
            min-height: 96px !important;
            max-height: 96px !important;
            background: var(--cell-bg); 
            border-radius: 14px; 
            display: flex !important; 
            align-items: center !important; 
            justify-content: center !important; 
            font-size: 2.75rem; 
            font-weight: 800; 
            cursor: pointer; 
            user-select: none; 
            border: 1px solid transparent; 
            transition: all 0.2s ease; 
        }
        
        .cell:hover:not(.taken) { background: #475569; transform: scale(1.02); }
        .cell.taken { cursor: not-allowed; background: #1e293b; border-color: #334155; }
        .cell.p-x { color: var(--color-x); text-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        .cell.p-o { color: var(--color-o); text-shadow: 0 0 12px rgba(244, 63, 94, 0.4); }
        
        /* GLOWING WINNER CELL PATTERN: Highlights the actual squares in neon green */
        .cell.winner-highlight {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: var(--color-draw) !important;
            color: var(--color-draw) !important;
            text-shadow: 0 0 16px var(--color-draw) !important;
            animation: pulseGlow 1.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 8px rgba(16, 185, 129, 0.2); }
            50% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); transform: scale(1.03); }
        }

        .controls { display: flex; flex-direction: column; gap: 10px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
        #restart-btn { background: var(--accent); color: white; }
        #reset-scoreboard-btn { background: transparent; color: var(--text-muted); border: 1px solid #334155; }
        #reset-scoreboard-btn:hover { color: #ef4444; background: #ef444415; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="scoreboard">
            <div class="score-box" id="score-x"><span class="label">Player X</span><span class="val">0</span></div>
            <div class="score-box" id="score-draw"><span class="label">Draws</span><span class="val">0</span></div>
            <div class="score-box" id="score-o"><span class="label">Player O</span><span class="val">0</span></div>
        </div>
        <div id="turn-indicator">Player X's Turn</div>
        
        <div class="board" id="board">
            <div class="board-row">
                <div class="cell" data-id="0"></div>
                <div class="cell" data-id="1"></div>
                <div class="cell" data-id="2"></div>
            </div>
            <div class="board-row">
                <div class="cell" data-id="3"></div>
                <div class="cell" data-id="4"></div>
                <div class="cell" data-id="5"></div>
            </div>
            <div class="board-row">
                <div class="cell" data-id="6"></div>
                <div class="cell" data-id="7"></div>
                <div class="cell" data-id="8"></div>
            </div>
        </div>
        
        <div class="controls">
            <button id="restart-btn">Next Round</button>
            <button id="reset-scoreboard-btn">Reset All Scores</button>
        </div>
    </div>
    <script>
        const cells = Array.from(document.querySelectorAll('.cell'));
        const board = document.getElementById('board');
        const indicator = document.getElementById('turn-indicator');
        let player = 'X';
        let active = true;
        let scores = { X: 0, O: 0, draws: 0 };
        let winningCombination = [];

        function checkWin() {
            const vals = cells.map(c => c.textContent);
            const patterns = ["012","345","678","036","147","258","048","246"];
            
            return patterns.some(p => {
                const posA = parseInt(p.at(0));
                const posB = parseInt(p.at(1));
                const posC = parseInt(p.at(2));
                
                if (vals.at(posA) !== "" && vals.at(posA) === vals.at(posB) && vals.at(posA) === vals.at(posC)) {
                    winningCombination = [posA, posB, posC]; // Stores winning indexes
                    return true;
                }
                return false;
            });
        }

        board.addEventListener('click', (e) => {
            if (!active || !e.target.classList.contains('cell') || e.target.textContent !== "") return;
            
            e.target.textContent = player;
            e.target.classList.add('taken', player === 'X' ? 'p-x' : 'p-o');

            if (checkWin()) {
                indicator.innerHTML = `Player <span style="color: var(--color-${player.toLowerCase()})">${player}</span> Wins!`;
                scores[player]++;
                document.querySelector(`#score-${player.toLowerCase()} .val`).textContent = scores[player];
                
                // Highlights winning sequence pattern with glowing green frames
                winningCombination.forEach(index => {
                    cells.at(index).classList.add('winner-highlight');
                });
                
                active = false;
                return;
            }

            if (cells.every(c => c.textContent !== "")) {
                indicator.innerHTML = `<span style="color: var(--color-draw)">It's a Draw!</span>`;
                scores.draws++;
                document.querySelector('#score-draw .val').textContent = scores.draws;
                active = false;
                return;
            }

            player = player === 'X' ? 'O' : 'X';
            indicator.innerHTML = `Player <span style="color: var(--color-${player.toLowerCase()})">${player}</span>'s Turn`;
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            active = true;
            player = 'X';
            indicator.innerHTML = "Player <span style=\"color: var(--color-x)\">X</span>'s Turn";
            winningCombination = [];
            cells.forEach(c => { c.textContent = ""; c.className = "cell"; });
        });

        document.getElementById('reset-scoreboard-btn').addEventListener('click', () => {
            scores = { X: 0, O: 0, draws: 0 };
            document.querySelectorAll('.val').forEach(v => v.textContent = "0");
            document.getElementById('restart-btn').click();
        });
    </script>
</body>
</html>
