<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        :root { --bg: #1e2530; --panel: #1a1f29; --cell: #2a3547; --text: #f8fafc; --muted: #94a3b8; --x: #38bdf8; --o: #f43f5e; --win: #10b981; --accent: #6366f1; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { text-align: center; background: var(--panel); padding: 30px; border-radius: 20px; width: 380px; border: 1px solid #2d3748; }
        .title-group { margin-bottom: 25px; }
        h1 { font-size: 2.2rem; background: linear-gradient(to right, var(--x), var(--o)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .signature-text { display: block; font-size: 0.9rem; color: var(--muted); margin-top: 6px; }
        .scoreboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        .score-box { background: rgba(15, 23, 42, 0.4); padding: 12px; border-radius: 12px; border: 1px solid #2d3748; display: flex; flex-direction: column; }
        .label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); font-weight: 700; }
        .val { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
        #score-x .val { color: var(--x); } #score-draw .val { color: var(--win); } #score-o .val { color: var(--o); }
        #turn-indicator { font-size: 1.2rem; font-weight: 600; margin-bottom: 25px; }
        .board { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .board-row { display: flex; gap: 12px; justify-content: center; }
        .cell { width: 96px; height: 96px; background: var(--cell); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 2.75rem; font-weight: 800; cursor: pointer; user-select: none; transition: background 0.2s; }
        .cell:hover:not(.taken) { background: #3b4a63; }
        .cell.taken { cursor: not-allowed; background: rgba(15, 23, 42, 0.6); border-color: #2d3748; }
        .cell.p-x { color: var(--x); text-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
        .cell.p-o { color: var(--o); text-shadow: 0 0 12px rgba(244, 63, 94, 0.5); }
        .cell.winner-highlight { background: rgba(16, 185, 129, 0.2); border-color: var(--win); color: var(--win); text-shadow: 0 0 16px var(--win); }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        button.action-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
        #restart-btn { background: var(--accent); color: white; }
        #reset-scoreboard-btn { background: transparent; color: var(--muted); border: 1px solid #2d3748; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-group">
            <h1>Tic Tac Toe</h1>
            <span class="signature-text">Made by Quluzade Ibrahim</span>
        </div>
        <div class="scoreboard">
            <div class="score-box" id="score-x"><span class="label">Player X</span><span class="val" id="val-x">0</span></div>
            <div class="score-box" id="score-draw"><span class="label">Draws</span><span class="val" id="val-draw">0</span></div>
            <div class="score-box" id="score-o"><span class="label">Player O</span><span class="val" id="val-o">0</span></div>
        </div>
        <div id="turn-indicator">Player <span id="turn-text" style="color:var(--x)">X</span>'s Turn</div>
        <div class="board" id="board">
            <div class="board-row">
                <div class="cell" id="c0"></div><div class="cell" id="c1"></div><div class="cell" id="c2"></div>
            </div>
            <div class="board-row">
                <div class="cell" id="c3"></div><div class="cell" id="c4"></div><div class="cell" id="c5"></div>
            </div>
            <div class="board-row">
                <div class="cell" id="c6"></div><div class="cell" id="c7"></div><div class="cell" id="c8"></div>
            </div>
        </div>
        <div class="controls">
            <button class="action-btn" id="restart-btn">Next Round</button>
            <button class="action-btn" id="reset-scoreboard-btn">Reset All Scores</button>
        </div>
    </div>
    <script>
        const cells = [0,1,2,3,4,5,6,7,8].map(i => document.getElementById(`c${i}`));
        const board = document.getElementById('board'), indicator = document.getElementById('turn-indicator');
        let turn = 'X', active = true, scores = { X: 0, O: 0, draws: 0 };

        function checkWin() {
            const v = cells.map(c => c.textContent);
            const patterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let p of patterns) {
                if (v[p[0]] && v[p[0]] === v[p[1]] && v[p[0]] === v[p[2]]) {
                    p.forEach(i => cells[i].classList.add('winner-highlight'));
                    return true;
                }
            }
            return false;
        }

        board.addEventListener('click', (e) => {
            if (!active || !e.target.classList.contains('cell') || e.target.textContent !== "") return;
            e.target.textContent = turn;
            e.target.classList.add('taken', turn === 'X' ? 'p-x' : 'p-o');
            if (checkWin()) {
                indicator.innerHTML = `Player <span style="color:var(--${turn.toLowerCase()})">${turn}</span> Wins!`;
                scores[turn]++;
                document.getElementById(`val-${turn.toLowerCase()}`).textContent = scores[turn];
                active = false;
                return;
            }
            if (cells.every(c => c.textContent !== "")) {
                indicator.innerHTML = `<span style="color:var(--win)">It's a Draw!</span>`;
                scores.draws++;
                document.getElementById('val-draw').textContent = scores.draws;
                active = false;
                return;
            }
            turn = turn === 'X' ? 'O' : 'X';
            indicator.innerHTML = `Player <span style="color:var(--${turn.toLowerCase()})">${turn}</span>'s Turn`;
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            active = true; turn = 'X';
            indicator.innerHTML = `Player <span style="color:var(--x)">X</span>'s Turn`;
            cells.forEach(c => { c.textContent = ""; c.className = "cell"; });
        });

        document.getElementById('reset-scoreboard-btn').addEventListener('click', () => {
            scores = { X: 0, O: 0, draws: 0 };
            ['x', 'o', 'draw'].forEach(id => document.getElementById(`val-${id}`).textContent = "0");
            document.getElementById('restart-btn').click();
        });
    </script>
</body>
</html>
