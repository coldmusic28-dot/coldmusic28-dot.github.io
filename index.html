<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --board-color: #16213e;
            --text-color: #e94560;
            --cell-color: #0f3460;
            --cell-hover: #0f3460aa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 10px;
            color: var(--text-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .status {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background-color: var(--board-color);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cell {
            background-color: var(--cell-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .cell:hover {
            background-color: var(--cell-hover);
            transform: scale(1.05);
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.x-mark {
            color: #e94560;
        }

        .cell.o-mark {
            color: #537ec5;
        }

        #reset-btn {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: var(--text-color);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        #reset-btn:hover {
            transform: translateY(-3px);
        }

        #reset-btn:active {
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <h1>Tic Tac Toe</h1>
    <div class="status" id="status-display">Player X's Turn</div>

    <div class="board" id="game-board">
        <div class="cell" data-index="0" id="cell-0"></div>
        <div class="cell" data-index="1" id="cell-1"></div>
        <div class="cell" data-index="2" id="cell-2"></div>
        <div class="cell" data-index="3" id="cell-3"></div>
        <div class="cell" data-index="4" id="cell-4"></div>
        <div class="cell" data-index="5" id="cell-5"></div>
        <div class="cell" data-index="6" id="cell-6"></div>
        <div class="cell" data-index="7" id="cell-7"></div>
        <div class="cell" data-index="8" id="cell-8"></div>
    </div>

    <button id="reset-btn">Restart Game</button>

    <script>
        const boardElement = document.getElementById('game-board');
        const statusDisplay = document.getElementById('status-display');
        const resetBtn = document.getElementById('reset-btn');
        const cells = document.querySelectorAll('.cell');

        let currentPlayer = 'X';
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function handleCellClick(clickedCellEvent) {
            const clickedCell = clickedCellEvent.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (gameState[clickedCellIndex] !== "" || !gameActive) {
                return;
            }

            handleCellPlayed(clickedCell, clickedCellIndex);
            handleResultValidation();
        }

        function handleCellPlayed(clickedCell, clickedCellIndex) {
            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.innerText = currentPlayer;
            clickedCell.classList.add('taken');
            if (currentPlayer === 'X') {
                clickedCell.classList.add('x-mark');
            } else {
                clickedCell.classList.add('o-mark');
            }
        }

        function handleResultValidation() {
            let roundWon = false;
            for (let i = 0; i <= 7; i++) {
                const winCondition = winningConditions[i];
                let a = gameState[winCondition[0]];
                let b = gameState[winCondition[1]];
                let c = gameState[winCondition[2]];
                if (a === '' || b === '' || c === '') {
                    continue;
                }
                if (a === b && b === c) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.innerText = `Player ${currentPlayer} Wins!`;
                gameActive = false;
                return;
            }

            let roundDraw = !gameState.includes("");
            if (roundDraw) {
                statusDisplay.innerText = "Draw!";
                gameActive = false;
                return;
            }

            handlePlayerChange();
        }

        function handlePlayerChange() {
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusDisplay.innerText = `Player ${currentPlayer}'s Turn`;
        }

        function handleRestartGame() {
            gameActive = true;
            currentPlayer = "X";
            gameState = ["", "", "", "", "", "", "", "", ""];
            statusDisplay.innerText = `Player X's Turn`;
            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove('taken', 'x-mark', 'o-mark');
            });
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetBtn.addEventListener('click', handleRestartGame);
    </script>
</body>
</html>
