<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            color: #00ffcc;
        }
        .status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            height: 30px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background-color: #333;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .cell {
            background-color: #222;
            border: none;
            border-radius: 5px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .cell:hover {
            background-color: #2a2a2a;
        }
        .cell.x {
            color: #ff4a4a;
        }
        .cell.o {
            color: #3498db;
        }
        .cell:disabled {
            cursor: not-allowed;
        }
        .restart-btn {
            margin-top: 25px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #00ffcc;
            color: #1a1a1a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
        }
        .restart-btn:hover {
            opacity: 0.9;
        }
        .restart-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <div class="status" id="statusBox">Player X's turn</div>

    <div class="board" id="gameBoard">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>

    <button class="restart-btn" id="restartButton">Restart Game</button>

    <script>
        const board = document.getElementById('gameBoard');
        const cells = document.querySelectorAll('.cell');
        const statusBox = document.getElementById('statusBox');
        const restartButton = document.getElementById('restartButton');

        let currentPlayer = 'X';
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (gameState[clickedCellIndex] !== "" || !isGameActive) {
                return;
            }

            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.textContent = currentPlayer;
            clickedCell.classList.add(currentPlayer.toLowerCase());
            clickedCell.disabled = true;

            checkResult();
        }

        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (gameState[a] === "" || gameState[b] === "" || gameState[c] === "") {
                    continue;
                }
                if (gameState[a] === gameState[b] && gameState[b] === gameState[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusBox.textContent = `Player ${currentPlayer} Wins!`;
                statusBox.style.color = '#00ffcc';
                isGameActive = false;
                return;
            }

            if (!gameState.includes("")) {
                statusBox.textContent = "Game ended in a draw!";
                statusBox.style.color = '#eccc68';
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusBox.textContent = `Player ${currentPlayer}'s turn`;
        }

        function resetGame() {
            currentPlayer = 'X';
            gameState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            statusBox.textContent = "Player X's turn";
            statusBox.style.color = '#fff';
            cells.forEach(cell => {
                cell.textContent = "";
                cell.className = "cell";
                cell.disabled = false;
            });
        }

        board.addEventListener('click', (e) => {
            if(e.target.classList.contains('cell')) {
                handleCellClick(e);
            }
        });
        restartButton.addEventListener('click', resetGame);
    </script>
</body>
</html>
