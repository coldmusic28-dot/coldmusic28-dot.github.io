<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe</title>
    <style>
        :root {
            --bg: #0d0f14;
            --panel: #161a23;
            --card: #212735;
            --blue: #38bdf8;
            --red: #ef4444;
            --green: #10b981;
            --purple: #6366f1;
            --purple-hover: #4f46e5;
            --g-blue: 0 0 15px rgba(56, 189, 248, 0.6);
            --g-red: 0 0 15px rgba(239, 68, 68, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: var(--panel);
            padding: 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .author { font-size: 0.85rem; color: #64748b; margin-bottom: 20px; }
        .score-board { display: flex; width: 100%; margin-bottom: 20px; gap: 10px; }
        .score-card {
            background: var(--card);
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .score-label { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
        .score-val { font-size: 1.4rem; font-weight: 800; }
        .score-card.x .score-val { color: var(--blue); text-shadow: var(--g-blue); }
        .score-card.draws .score-val { color: var(--green); }
        .score-card.o .score-val { color: var(--red); text-shadow: var(--g-red); }
        .status { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; text-align: center; }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            aspect-ratio: 1;
            margin-bottom: 20px;
        }
        .cell {
            background: var(--card);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: calc(1.8rem + 3vw);
            max-font-size: 3.2rem;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
            border: 1px solid rgba(255,255,255,0.02);
            transition: all 0.2s ease;
        }
        .cell:hover { background: #262e3e; }
        .cell.x-mark { color: var(--blue); text-shadow: var(--g-blue); border-color: rgba(56,189,248,0.3); }
        .cell.o-mark { color: var(--red); text-shadow: var(--g-red); border-color: rgba(239,68,68,0.3); }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }
        .btn-p { background: var(--purple); color: #fff; box-shadow: 0 0 15px rgba(99,102,241,0.4); }
        .btn-p:hover { background: var(--purple-hover); }
        .btn-s { background: transparent; color: #64748b; border: 2px solid #2b3346; margin-bottom: 0; }
        .btn-s:hover { background: #1f2430; color: #94a3b8; }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <div class="author">Made by Quluzade Ibrahim</div>

        <div class="score-board">
            <div class="score-card x"><div class="score-label">Player X</div><div class="score-val" id="sx">0</div></div>
            <div class="score-card draws"><div class="score-label">Draws</div><div class="score-val" id="sd">0</div></div>
            <div class="score-card o"><div class="score-label">Player O</div><div class="score-val" id="so">0</div></div>
        </div>

        <div class="status" id="stat">Player <span style="color:var(--blue);text-shadow:var(--g-blue);">X</span>'s Turn</div>

        <div class="board">
            <div class="cell" id="b0" onclick="tap('b0')"></div>
            <div class="cell" id="b1" onclick="tap('b1')"></div>
            <div class="cell" id="b2" onclick="tap('b2')"></div>
            <div class="cell" id="b3" onclick="tap('b3')"></div>
            <div class="cell" id="b4" onclick="tap('b4')"></div>
            <div class="cell" id="b5" onclick="tap('b5')"></div>
            <div class="cell" id="b6" onclick="tap('b6')"></div>
            <div class="cell" id="b7" onclick="tap('b7')"></div>
            <div class="cell" id="b8" onclick="tap('b8')"></div>
        </div>

        <button class="btn btn-p" onclick="next()">Next Round</button>
        <button class="btn btn-s" onclick="reset()">Reset All</button>
    </div>

    <script>
        var stat = document.getElementById('stat');
        var sx = document.getElementById('sx'), so = document.getElementById('so'), sd = document.getElementById('sd');
        var pX = 0, pO = 0, dr = 0;
        var turn = 'X', active = true;

        function tap(id) {
            if (!active) return;
            var c = document.getElementById(id);
            if (c.innerText !== "") return;

            c.innerText = turn;
            c.classList.add(turn === 'X' ? 'x-mark' : 'o-mark');

            var v0 = document.getElementById('b0').innerText;
            var v1 = document.getElementById('b1').innerText;
            var v2 = document.getElementById('b2').innerText;
            var v3 = document.getElementById('b3').innerText;
            var v4 = document.getElementById('b4').innerText;
            var v5 = document.getElementById('b5').innerText;
            var v6 = document.getElementById('b6').innerText;
            var v7 = document.getElementById('b7').innerText;
            var v8 = document.getElementById('b8').innerText;

            var win = false;
            if (v0 !== "" && v0 === v1 && v0 === v2) win = true;
            if (v3 !== "" && v3 === v4 && v3 === v5) win = true;
            if (v6 !== "" && v6 === v7 && v6 === v8) win = true;
            if (v0 !== "" && v0 === v3 && v0 === v6) win = true;
            if (v1 !== "" && v1 === v4 && v1 === v7) win = true;
            if (v2 !== "" && v2 === v5 && v2 === v8) win = true;
            if (v0 !== "" && v0 === v4 && v0 === v8) win = true;
            if (v2 !== "" && v2 === v4 && v2 === v6) win = true;

            if (win) {
                var clr = turn === 'X' ? 'var(--blue)' : 'var(--red)';
                var glw = turn === 'X' ? 'var(--g-blue)' : 'var(--g-red)';
                stat.innerHTML = 'Player <span style="color:' + clr + ';text-shadow:' + glw + ';">' + turn + '</span> Wins!';
                if (turn === 'X') { pX++; } else { pO++; }
                up(); active = false; return;
            }

            if (v0 !== "" && v1 !== "" && v2 !== "" && v3 !== "" && v4 !== "" && v5 !== "" && v6 !== "" && v7 !== "" && v8 !== "") {
                stat.innerHTML = '<span style="color:var(--green)">It\'s a Draw!</span>';
                dr++; up(); active = false; return;
            }

            turn = turn === 'X' ? 'O' : 'X';
            var nC = turn === 'X' ? 'var(--blue)' : 'var(--red)';
            var nG = turn === 'X' ? 'var(--g-blue)' : 'var(--g-red)';
            stat.innerHTML = 'Player <span style="color:' + nC + ';text-shadow:' + nG + ';">' + turn + '</span>\'s Turn';
        }

        function up() { sx.innerText = pX; so.innerText = pO; sd.innerText = dr; }

        function next() {
            active = true; turn = 'X';
            stat.innerHTML = 'Player <span style="color:var(--blue);text-shadow:var(--g-blue);">X</span>\'s Turn';
            for (var i = 0; i < 9; i++) {
                var c = document.getElementById('b' + i);
                c.innerText = ""; c.className = "cell";
            }
        }

        function reset() { pX = 0; pO = 0; dr = 0; up(); next(); }
    </script>
</body>
</html>
