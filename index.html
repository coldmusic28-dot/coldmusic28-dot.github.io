<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe</title>
    <style>
        :root { --bg: #03001e; --panel: rgba(11,3,44,.65); --cell: rgba(36,11,74,.4); --text: #f1ecf9; --x: #00f2fe; --o: #fe019a; --win: #39ff14; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        body { background: radial-gradient(circle, #0c0226 0%, var(--bg) 100%); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { text-align: center; background: var(--panel); backdrop-filter: blur(16px); padding: 25px; border-radius: 24px; width: 360px; border: 1px solid rgba(115,34,163,.4); }
        h1 { font-size: 2rem; background: linear-gradient(135deg, var(--x), var(--o)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .sig { display: block; font-size: .8rem; color: #a394cc; font-weight: 600; margin: 4px 0 20px 0; }
        .scoreboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .score-box { background: rgba(3,0,30,.6); padding: 10px; border-radius: 12px; border: 1px solid rgba(163,148,204,.15); }
        .label { font-size: .7rem; text-transform: uppercase; color: #a394cc; font-weight: 700; }
        .val { font-size: 1.4rem; font-weight: 800; margin-top: 2px; }
        #score-x .val { color: var(--x); } #score-draw .val { color: var(--win); } #score-o .val { color: var(--o); }
        #turn-indicator { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
        .board { display: grid; grid-template-columns: repeat(3, 90px); gap: 10px; justify-content: center; margin-bottom: 20px; }
        .cell { width: 90px; height: 90px; background: var(--cell); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 900; cursor: pointer; user-select: none; border: 1px solid rgba(115,34,163,.15); }
        .cell:hover:not(.taken) { background: rgba(115,34,163,.3); border-color: rgba(0,242,254,.5); }
        .cell.taken { cursor: not-allowed; background: rgba(3,0,30,.4); }
        .cell.p-x { color: var(--x); text-shadow: 0 0 10px var(--x); }
        .cell.p-o { color: var(--o); text-shadow: 0 0 10px var(--o); }
        .cell.winner-highlight { background: rgba(57,255,20,.15) !important; border-color: var(--win) !important; color: var(--win) !important; text-shadow: 0 0 15px var(--win) !important; }
        button { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: .9rem; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
        #restart-btn { background: linear-gradient(135deg, #7322a3, #50127a); color: #fff; }
        #reset-scoreboard-btn { background: transparent; color: #a394cc; border: 1px solid rgba(163,148,204,.2); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <span class="sig">Made by Quluzade Ibrahim</span>
        <div class="scoreboard">
            <div class="score-box" id="score-x"><div class="label">Player X</div><div class="val" id="val-x">0</div></div>
            <div class="score-box" id="score-draw"><div class="label">Draws</div><div class="val" id="val-draw">0</div></div>
            <div class="score-box" id="score-o"><div class="label">Player O</div><div class="val" id="val-o">0</div></div>
        </div>
        <div id="turn-indicator">STATUS: <span id="turn-text" style="color:var(--x)">X_TURN</span></div>
        <div class="board" id="board">
            <div class="cell" id="c0"></div><div class="cell" id="c1"></div><div class="cell" id="c2"></div>
            <div class="cell" id="c3"></div><div class="cell" id="c4"></div><div class="cell" id="c5"></div>
            <div class="cell" id="c6"></div><div class="cell" id="c7"></div><div class="cell" id="c8"></div>
        </div>
        <button id="restart-btn">Cycle Round</button>
        <button id="reset-scoreboard-btn">Wipe Memory</button>
    </div>
    <script>
        const board = document.getElementById('board'), turnLabel = document.getElementById('turn-text');
        const c0 = document.getElementById("c0"), c1 = document.getElementById("c1"), c2 = document.getElementById("c2");
        const c3 = document.getElementById("c3"), c4 = document.getElementById("c4"), c5 = document.getElementById("c5");
        const c6 = document.getElementById("c6"), c7 = document.getElementById("c7"), c8 = document.getElementById("c8");
        let turn = 'X', sx = 0, so = 0, sd = 0, active = true;

        function h(x, y, z) { x.classList.add('winner-highlight'); y.classList.add('winner-highlight'); z.classList.add('winner-highlight'); }

        function checkWinner() {
            let mark = "";
            if (c0.textContent !== "" && c0.textContent === c1.textContent && c0.textContent === c2.textContent) { mark = c0.textContent; h(c0, c1, c2); }
            else if (c3.textContent !== "" && c3.textContent === c4.textContent && c3.textContent === c5.textContent) { mark = c3.textContent; h(c3, c4, c5); }
            else if (c6.textContent !== "" && c6.textContent === c7.textContent && c6.textContent === c8.textContent) { mark = c6.textContent; h(c6, c7, c8); }
            else if (c0.textContent !== "" && c0.textContent === c3.textContent && c0.textContent === c6.textContent) { mark = c0.textContent; h(c0, c3, c6); }
            else if (c1.textContent !== "" && c1.textContent === c4.textContent && c1.textContent === c7.textContent) { mark = c1.textContent; h(c1, c4, c7); }
            else if (c2.textContent !== "" && c2.textContent === c5.textContent && c2.textContent === c8.textContent) { mark = c2.textContent; h(c2, c5, c8); }
            else if (c0.textContent !== "" && c0.textContent === c4.textContent && c0.textContent === c8.textContent) { mark = c0.textContent; h(c0, c4, c8); }
            else if (c2.textContent !== "" && c2.textContent === c4.textContent && c2.textContent === c6.textContent) { mark = c2.textContent; h(c2, c4, c6); }

            if (mark !== "") {
                document.getElementById('turn-indicator').innerHTML = `VICTORY: <span style="color:${mark === 'X' ? 'var(--x)' : 'var(--o)'}">${mark}_WINS</span>`;
                if (mark === "X") { sx++; document.getElementById("val-x").textContent = sx; }
                if (mark === "O") { so++; document.getElementById("val-o").textContent = so; }
                active = false; return true;
            }
            if (c0.textContent && c1.textContent && c2.textContent && c3.textContent && c4.textContent && c5.textContent && c6.textContent && c7.textContent && c8.textContent) {
                document.getElementById('turn-indicator').innerHTML = `<span style="color:var(--win)">MATCH_DRAW</span>`;
                sd++; document.getElementById('val-draw').textContent = sd;
                active = false; return true;
            }
            return false;
        }

        board.addEventListener('click', (e) => {
            if (!active || !e.target.classList.contains('cell') || e.target.textContent !== "") return;
            
            // Turn variables tracked purely inside local script memory avoids tracking state bugs
            e.target.textContent = turn; 
            e.target.classList.add('taken', turn === 'X' ? 'p-x' : 'p-o');
            
            if (!checkWinner()) {
                turn = (turn === 'X') ? 'O' : 'X';
                turnLabel.textContent = turn + "_TURN"; 
                turnLabel.style.color = (turn === 'X') ? 'var(--x)' : 'var(--o)';
            }
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            active = true; turn = 'X';
            document.getElementById('turn-indicator').innerHTML = `STATUS: <span id="turn-text" style="color:var(--x)">X_TURN</span>`;
            window.turnLabel = document.getElementById('turn-text');
            [c0,c1,c2,c3,c4,c5,c6,c7,c8].forEach(c => { c.textContent = ""; c.className = "cell"; });
        });

        document.getElementById('reset-scoreboard-btn').addEventListener('click', () => {
            sx = so = sd = 0;
            document.getElementById("val-x").textContent = "0";
            document.getElementById("val-o").textContent = "0";
            document.getElementById("val-draw").textContent = "0";
            document.getElementById('restart-btn').click();
        });
    </script>
</body>
</html>
