<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Retro Cyber</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        
        <div class="scoreboard">
            <div class="score-box" id="score-x">
                <span class="label">Player X</span>
                <span class="val">0</span>
            </div>
            <div class="score-box" id="score-draw">
                <span class="label">Draws</span>
                <span class="val">0</span>
            </div>
            <div class="score-box" id="score-o">
                <span class="label">Player O</span>
                <span class="val">0</span>
            </div>
        </div>

        <div id="turn-indicator">Player <span style="color: var(--color-x)">X</span>'s Turn</div>
        
        <!-- Main Board Grid Grid -->
        <div class="board" id="board">
            <div class="cell row-1 col-1 diag-1"></div>
            <div class="cell row-1 col-2"></div>
            <div class="cell row-1 col-3 diag-2"></div>
            <div class="cell row-2 col-1"></div>
            <div class="cell row-2 col-2 diag-1 diag-2"></div>
            <div class="cell row-2 col-3"></div>
            <div class="cell row-3 col-1 diag-2"></div>
            <div class="cell row-3 col-2"></div>
            <div class="cell row-3 col-3 diag-1"></div>
        </div>

        <div class="controls">
            <button id="restart-btn">Next Round</button>
            <button id="reset-scoreboard-btn">Reset All Scores</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
