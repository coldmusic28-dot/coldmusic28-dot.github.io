<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        :root {
            --bg-color: #1a1e29;
            --container-bg: #12151c;
            --card-bg: #1f2430;
            --text-blue: #38bdf8;
            --text-red: #ef4444;
            --text-green: #10b981;
            --btn-purple: #6366f1;
            --btn-purple-hover: #4f46e5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 20px;
            width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .author {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .score-board {
            display: flex;
            width: 100%;
            margin-bottom: 25px;
            gap: 10px;
        }

        .score-card {
            background-color: var(--card-bg);
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .score-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .score-value {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .score-card.x .score-value { color: var(--text-blue); }
        .score-card.draws .score-value { color: var(--text-green); }
        .score-card.o .score-value { color: var(--text-red); }

        .turn-indicator {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 25px;
        }

        .cell {
            background-color: var(--card-bg);
            aspect-ratio: 1;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .cell.x-mark {
            color: var(--text-blue);
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .cell.o-mark {
            color: var(--text-red);
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--btn-purple);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--btn-purple-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: #64748b;
            border: 2px solid #282f3f;
            margin-bottom: 0;
        }

        .btn-secondary:hover {
            background-color: #1f2430;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="author">Made by Quluzade Ibrahim</div>

        <div class="score-board">
            <div class="score-card x"><div class="score-label">Player X</div><div class="score-value" id="score-x">0</div></div>
            <div class="score-card draws"><div class="score-label">Draws</div><div class="score-value" id="score-draws">0</div></div>
            <div class="score-card o"><div class="score-label">Player O</div><div class="score-value" id="score-o">0</div></div>
        </div>

        <div class="turn-indicator" id="turn-display">Player <span id="turn-letter" style="color:var(--text-blue)">X</span>'s Turn</div>

        <div class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button class="btn btn-primary" id="next-round-btn">Next Round</button>
        <button class="btn btn-secondary" id="reset-all-btn">Reset All Scores</button>
    </div>

    <script>
        const turnDisplay = document.getElementById('turn-display');
        const cells = document.querySelectorAll('.cell');
        const scoreXDisplay = document.getElementById('score-x');
        const scoreODisplay = document.getElementById('score-o');
        const scoreDrawsDisplay = document.getElementById('score-draws');

        let scores = { X: 0, O: 0, draws: 0 };
        let currentPlayer = 'X';
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;

        // Flattened string ensures no markdown format stripping can happen
        const winPatterns = "0,1,2|3,4,5|6,7,8|0,3,6|1,4,7|2,5,8|0,4,8|2,4,6";
        const winningConditions = winPatterns.split('|').map(p => p.split(',').map(Number));

        cells.forEach(cell => cell.addEventListener('click', (e) => {
            const index = parseInt(e.target.getAttribute('data-index'));

            if (gameState[index] !== "" || !gameActive) return;

            gameState[index] = currentPlayer;
            e.target.innerText = currentPlayer;
            e.target.classList.add(currentPlayer === 'X' ? 'x-mark' : 'o-mark');

            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                const color = currentPlayer === 'X' ? 'var(--text-blue)' : 'var(--text-red)';
                turnDisplay.innerHTML = `Player <span style="color:${color}">${currentPlayer}</span> Wins!`;
                scores[currentPlayer]++;
                updateScores();
                gameActive = false;
                return;
            }

            if (!gameState.includes("")) {
                turnDisplay.innerHTML = `<span style="color:var(--text-green)">It's a Draw!</span>`;
                scores.draws++;
                updateScores();
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            const nextColor = currentPlayer === 'X' ? 'var(--text-blue)' : 'var(--text-red)';
            turnDisplay.innerHTML = `Player <span style="color:${nextColor}">${currentPlayer}</span>'s Turn`;
        }));

        function updateScores() {
            scoreXDisplay.innerText = scores.X;
            scoreODisplay.innerText = scores.O;
            scoreDrawsDisplay.innerText = scores.draws;
        }

        document.getElementById('next-round-btn').addEventListener('click', () => {
            gameActive = true;
            currentPlayer = 'X';
            gameState = ["", "", "", "", "", "", "", "", ""];
            turnDisplay.innerHTML = `Player <span style="color:var(--text-blue)">X</span>'s Turn`;
            cells.forEach(cell => { cell.innerText = ""; cell.className = "cell"; });
        });

        document.getElementById('reset-all-btn').addEventListener('click', () => {
            scores = { X: 0, O: 0, draws: 0 };
            updateScores();
            gameActive = true;
            currentPlayer = 'X';
            gameState = ["", "", "", "", "", "", "", "", ""];
            turnDisplay.innerHTML = `Player <span style="color:var(--text-blue)">X</span>'s Turn`;
            cells.forEach(cell => { cell.innerText = ""; cell.className = "cell"; });
        });
    </script>
</body>
</html>
