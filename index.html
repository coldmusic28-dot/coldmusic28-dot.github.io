<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe</title>
    <style>
        :root { --bg: #03001e; --panel: rgba(11,3,44,.65); --cell: rgba(36,11,74,.4); --text: #f1ecf9; --x: #00f2fe; --o: #fe019a; --win: #39ff14; --btn: linear-gradient(135deg, #7322a3, #50127a); --border: rgba(115,34,163,.4); }
        [data-theme="light"] { --bg: #f0f2f5; --panel: rgba(255,255,255,.9); --cell: rgba(220,225,235,.6); --text: #1a1a2e; --x: #0076ff; --o: #e60067; --win: #00b300; --btn: linear-gradient(135deg, #0076ff, #0044bb); --border: rgba(0,118,255,.3); }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        body { background: radial-gradient(circle, #0c0226 0%, var(--bg) 100%); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; transition: background .3s; }
        .container { text-align: center; background: var(--panel); backdrop-filter: blur(16px); padding: 20px; border-radius: 24px; width: 340px; border: 1px solid var(--border); }
        h1 { font-size: 1.8rem; background: linear-gradient(135deg, var(--x), var(--o)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
        .sig { display: block; font-size: .8rem; color: #a394cc; font-weight: 600; margin: 2px 0 10px 0; }
        .theme-btn { padding: 4px 10px; font-size: .7rem; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 20px; cursor: pointer; float: right; }
        .scoreboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 15px 0; }
        .score-box { background: rgba(3,0,30,.2); padding: 8px; border-radius: 12px; border: 1px solid rgba(163,148,204,.15); }
        .label { font-size: .65rem; text-transform: uppercase; color: #a394cc; font-weight: 700; }
        .val { font-size: 1.3rem; font-weight: 800; }
        #score-x .val { color: var(--x); } #score-draw .val { color: var(--win); } #score-o .val { color: var(--o); }
        #turn-indicator { font-size: 1rem; font-weight: 700; margin-bottom: 15px; }
        .board { display: grid; grid-template-columns: repeat(3, 85px); gap: 8px; justify-content: center; margin-bottom: 15px; }
        .cell { width: 85px; height: 85px; background: var(--cell); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 900; cursor: pointer; user-select: none; border: 1px solid rgba(115,34,163,.15); }
        .cell:hover:not(.taken) { background: rgba(115,34,163,.2); border-color: var(--x); }
        .cell.p-x { color: var(--x); text-shadow: 0 0 10px var(--x); }
        .cell.p-o { color: var(--o); text-shadow: 0 0 10px var(--o); }
        .cell.win { background: rgba(57,255,20,.15) !important; border-color: var(--win) !important; color: var(--win) !important; text-shadow: 0 0 15px var(--win) !important; }
        button.act { width: 100%; padding: 10px; border: none; border-radius: 12px; font-size: .85rem; font-weight: 700; cursor: pointer; margin-bottom: 6px; }
        #restart-btn { background: var(--btn); color: #fff; }
        #reset-btn { background: transparent; color: #a394cc; border: 1px solid var(--border); }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <button class="theme-btn" id="t-btn">Bright Mode</button>
        <div style="clear:both"></div>
        <h1>Tic Tac Toe</h1>
        <span class="sig">Made by Quluzade Ibrahim</span>
        <div class="scoreboard">
            <div class="score-box" id="score-x"><div class="label">Player X</div><div class="val" id="val-x">0</div></div>
            <div class="score-box" id="score-draw"><div class="label">Draws</div><div class="val" id="val-draw">0</div></div>
            <div class="score-box" id="score-o"><div class="label">Player O</div><div class="val" id="val-o">0</div></div>
        </div>
        <div id="turn-indicator">STATUS: <span id="turn-text" style="color:var(--x)">X_TURN</span></div>
        <div class="board" id="board">
            <div class="cell" id="c0"></div><div class="cell" id="c1"></div><div class="cell" id="c2"></div>
            <div class="cell" id="c3"></div><div class="cell" id="c4"></div><div class="cell" id="c5"></div>
            <div class="cell" id="c6"></div><div class="cell" id="c7"></div><div class="cell" id="c8"></div>
        </div>
        <button class="act" id="restart-btn">Cycle Round</button>
        <button class="act" id="reset-btn">Wipe Memory</button>
    </div>
    <script>
        const b = document.getElementById('board');
        let tl = document.getElementById('turn-text');
        const c = [0,1,2,3,4,5,6,7,8].map(i => document.getElementById('c'+i));
        let turn = 'X', sx = 0, so = 0, sd = 0, active = true;
        const wl = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        function check() {
            for (let line of wl) {
                const [x, y, z] = line;
                if (c[x].textContent && c[x].textContent === c[y].textContent && c[x].textContent === c[z].textContent) {
                    [x, y, z].forEach(i => c[i].classList.add('win'));
                    const m = c[x].textContent;
                    document.getElementById('turn-indicator').innerHTML = `VICTORY: <span style="color:${m==='X'?'var(--x)':'var(--o)'}">${m}_WINS</span>`;
                    if (m === 'X') { sx++; document.getElementById('val-x').textContent = sx; }
                    else { so++; document.getElementById('val-o').textContent = so; }
                    active = false; return true;
                }
            }
            if (c.every(cell => cell.textContent !== "")) {
                document.getElementById('turn-indicator').innerHTML = `<span style="color:var(--win)">MATCH_DRAW</span>`;
                sd++; document.getElementById('val-draw').textContent = sd;
                active = false; return true;
            }
            return false;
        }

        b.addEventListener('click', (e) => {
            if (!active || !e.target.classList.contains('cell') || e.target.textContent !== "") return;
            e.target.textContent = turn;
            e.target.classList.add('taken', turn === 'X' ? 'p-x' : 'p-o');
            if (!check()) {
                turn = turn === 'X' ? 'O' : 'X';
                tl.textContent = turn + "_TURN";
                tl.style.color = turn === 'X' ? 'var(--x)' : 'var(--o)';
            }
        });

        document.getElementById('t-btn').addEventListener('click', (e) => {
            const th = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', th);
            e.target.textContent = th === 'dark' ? 'Bright Mode' : 'Dark Mode';
            tl.style.color = turn === 'X' ? 'var(--x)' : 'var(--o)';
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            active = true; turn = 'X';
            document.getElementById('turn-indicator').innerHTML = `STATUS: <span id="turn-text" style="color:var(--x)">X_TURN</span>`;
            tl = document.getElementById('turn-text');
            c.forEach(cell => { cell.textContent = ""; cell.className = "cell"; });
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            sx = so = sd = 0;
            document.getElementById('val-x').textContent = '0';
            document.getElementById('val-o').textContent = '0';
            document.getElementById('val-draw').textContent = '0';
            document.getElementById('restart-btn').click();
        });
    </script>
</body>
</html>
